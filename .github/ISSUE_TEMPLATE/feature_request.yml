name: Feature request
description: Propose a focused navigation or maintainability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow limitation rather than only the desired control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Relevant engine
      options:
        - Both engines
        - clangd
        - Microsoft C/C++ language service (cpptools)
        - UI or engine-independent
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
