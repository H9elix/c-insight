name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CINSIGHT_TEST_CLANGD: clangd-20
      CINSIGHT_TEST_CLANGD20: /usr/bin/clangd-20
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install clangd 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-snapshot.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clangd-20

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches the extension version
        run: node -e 'const version=require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${version}`)'

      - name: Audit and package
        run: |
          npm audit --audit-level=low
          npm run package

      - name: Create checksums
        run: sha256sum "c-insight-${GITHUB_REF_NAME#v}.vsix" > SHA256SUMS

      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "c-insight-${GITHUB_REF_NAME#v}.vsix" SHA256SUMS --verify-tag --generate-notes --title "C Insight ${GITHUB_REF_NAME#v}"
